<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trivia de Historia Universal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --success: #22c55e;
      --danger: #ef4444;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .game-container {
      background-color: var(--card);
      border-radius: 12px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-weight: bold;
      color: var(--accent);
    }
    .question {
      font-size: 1.2rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .options {
      display: grid;
      gap: 10px;
    }
    button {
      background-color: #334155;
      color: var(--text);
      border: 2px solid transparent;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      text-align: left;
      transition: all 0.2s ease;
    }
    button:hover:not(:disabled) {
      border-color: var(--accent);
      background-color: #475569;
    }
    button:disabled { cursor: not-allowed; }
    .correct { background-color: var(--success) !important; color: white; }
    .incorrect { background-color: var(--danger) !important; color: white; }
    .explanation {
      margin-top: 20px;
      padding: 15px;
      background-color: #0f172a;
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      display: none;
    }
    .next-btn {
      margin-top: 20px;
      width: 100%;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: bold;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <span id="score">Puntos: 0</span>
    <span id="progress">Pregunta 1/5</span>
  </div>

  <div id="quiz">
    <div class="question" id="question-text">Cargando pregunta...</div>
    <div class="options" id="options-container"></div>
    <div class="explanation" id="explanation-text"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Siguiente Pregunta</button>
  </div>

  <div id="result" style="display: none; text-align: center;">
    <h2>¡Juego Terminado!</h2>
    <p id="final-score" style="font-size: 1.5rem;"></p>
    <button onclick="restartGame()" style="text-align: center;">Jugar de Nuevo</button>
  </div>
</div>

<script>
  const questions = [
    {
      q: "¿Qué hito de la Edad Antigua es considerado el primer código legal escrito y conservado integralmente?",
      options: ["Las Doce Tablas", "El Código de Hammurabi", "El Código de Justiniano", "El Edicto de Milán"],
      correct: 1,
      exp: "El Código de Hammurabi (Babilonia, 1750 a.C.) estableció principios de justicia unificados basados en la ley del talión."
    },
    {
      q: "La caída de este imperio en 1453 marcó tradicionalmente el inicio de la Edad Moderna:",
      options: ["Imperio Romano de Occidente", "Imperio Otomano", "Imperio Bizantino", "Imperio Carolingio"],
      correct: 2,
      exp: "La caída de Constantinopla a manos de los otomanos puso fin a más de mil años de existencia del Imperio Romano de Oriente (Bizantino)."
    },
    {
      q: "¿Qué invento desarrollado por Johannes Gutenberg hacia 1440 revolucionó la difusión de la cultura?",
      options: ["El astrolabio", "La imprenta de tipos móviles", "El telégrafo óptico", "El papel de arroz"],
      correct: 1,
      exp: "La imprenta permitió democratizar el acceso al conocimiento y aceleró eventos como la Reforma Protestante y el Renacimiento."
    },
    {
      q: "¿Cuál de los siguientes acontecimientos inició la llamada Edad Contemporánea en 1789?",
      options: ["Independencia de EE. UU.", "La Revolución Francesa", "La Coronación de Napoleón", "La Revolución Industrial"],
      correct: 1,
      exp: "La Revolución Francesa sentó las bases de la democracia moderna y los derechos fundamentales del ciudadano en Occidente."
    },
    {
      q: "Conflicto diplomático e ideológico entre EE. UU. y la URSS sin enfrentamiento militar directo:",
      options: ["Primera Guerra Mundial", "Guerra de los Siete Años", "La Guerra Fría", "Guerra de Corea"],
      correct: 2,
      exp: "La Guerra Fría (1947-1991) dividió al mundo en dos bloques ideológicos y determinó la geopolítica global de la segunda mitad del siglo XX."
    }
  ];

  let currentIdx = 0;
  let score = 0;

  function loadQuestion() {
    const q = questions[currentIdx];
    document.getElementById("progress").innerText = `Pregunta ${currentIdx + 1}/${questions.length}`;
    document.getElementById("question-text").innerText = q.q;
    document.getElementById("explanation-text").style.display = "none";
    document.getElementById("next-btn").style.display = "none";

    const container = document.getElementById("options-container");
    container.innerHTML = "";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      container.appendChild(btn);
    });
  }

  function selectOption(selectedIdx) {
    const q = questions[currentIdx];
    const buttons = document.querySelectorAll("#options-container button");

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correct) btn.classList.add("correct");
      if (idx === selectedIdx && selectedIdx !== q.correct) btn.classList.add("incorrect");
    });

    if (selectedIdx === q.correct) {
      score += 100;
      document.getElementById("score").innerText = `Puntos: ${score}`;
    }

    const expText = document.getElementById("explanation-text");
    expText.innerText = q.exp;
    expText.style.display = "block";
    document.getElementById("next-btn").style.display = "block";
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < questions.length) {
      loadQuestion();
    } else {
      document.getElementById("quiz").style.display = "none";
      document.getElementById("result").style.display = "block";
      document.getElementById("final-score").innerText = `Puntaje final: ${score} de ${questions.length * 100} puntos.`;
    }
  }

  function restartGame() {
    currentIdx = 0;
    score = 0;
    document.getElementById("score").innerText = "Puntos: 0";
    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";
    loadQuestion();
  }

  loadQuestion();
</script>
</body>
</html>
